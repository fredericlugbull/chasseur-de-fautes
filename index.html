<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chasseur de fautes</title>
<meta name="description" content="Jeu d'orthographe gratuit, du CE2 à la 2nde : accords, é ou er, homophones, dictées. Sans pub, sans compte, rien n'est envoyé sur Internet.">
<meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1525" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/lexend-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Lexend";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lexend-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Lexend";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/lexend-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Lexend";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/lexend-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bungee";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bungee-latin-400-normal.woff2) format("woff2")}
/* Layout : une seule colonne façon tableau de score de gymnase ; les lettres rouges de la maîtresse (A, I, H) deviennent les missions. Le 5e jeu est une borne d'arcade dans l'espace. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#e3e9f3; --ink:#14213d; --muted:#55627d;
  --court:#2459d6; --ball:#ffc23c; --ball-ink:#3a2a00; --red:#d63a2f; --ok:#1d8a4e; --ok-bg:#e1f4e8; --ko-bg:#fbe6e3;
  --line:#cdd6e5; --space:#0b0f24; --space-ink:#eaf0ff;
  --display:"Bungee", "Arial Black", Impact, sans-serif;
  --body:"Lexend", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1525; --surface:#172238; --surface-2:#1f2c47; --ink:#e8eef8; --muted:#9fb0cc;
  --court:#7aa2ff; --ball:#ffc23c; --ball-ink:#2a1e00; --red:#ff7a6e; --ok:#5fd394; --ok-bg:#163a29; --ko-bg:#45201d;
  --line:#2b3a59; --space:#070a1a; --space-ink:#eaf0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1525; --surface:#172238; --surface-2:#1f2c47; --ink:#e8eef8; --muted:#9fb0cc;
  --court:#7aa2ff; --ball:#ffc23c; --ball-ink:#2a1e00; --red:#ff7a6e; --ok:#5fd394; --ok-bg:#163a29; --ko-bg:#45201d;
  --line:#2b3a59; --space:#070a1a; --space-ink:#eaf0ff; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 40px}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--court);outline-offset:2px}

.board{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.board h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,5.5vw,32px);line-height:1;margin:0;letter-spacing:.5px}
.board h1 span{color:var(--ball)}
.board .who{font-size:14px;opacity:.8}
.stats{display:flex;gap:14px;text-align:right}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1;color:var(--ball);font-variant-numeric:tabular-nums}
.stat small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.lvl{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.lvl-row{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.sync{font-size:12px;opacity:.7}
.bar{height:10px;background:color-mix(in srgb,var(--bg) 22%,transparent);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ball);border-radius:99px;transition:width .5s}

.home{display:flex;flex-direction:column;gap:16px}
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.missions{grid-template-columns:1fr}}
.mission{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;transition:transform .15s,border-color .15s}
.mission:hover{border-color:var(--court);transform:translateY(-2px)}
.mark{grid-row:1/3;font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;font-weight:700;font-size:44px;line-height:1;color:var(--red);width:44px;text-align:center;transform:rotate(-6deg)}
.mission h3{margin:0;font-size:18px}
.mission p{margin:0;color:var(--muted);font-size:14px}
.mission.arcade{grid-column:1/-1;background:var(--space);color:var(--space-ink);border-color:var(--space);position:relative;overflow:hidden}
.mission.arcade p{color:#b9c5ec}
.mission.arcade .mark{color:var(--ball);font-family:var(--display);font-weight:400;transform:none;font-size:34px}
.mission.arcade h3{font-family:var(--display);font-weight:400;letter-spacing:.04em;font-size:20px}
.mission.arcade::after{content:"";position:absolute;inset:0;background:radial-gradient(1px 1px at 12% 30%,#fff,transparent),radial-gradient(1px 1px at 72% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 70%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 58% 45%,#fff,transparent);opacity:.7;pointer-events:none}
.section-title{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.06em;color:var(--muted);margin:4px 0 -8px}

.card{background:var(--surface);border-radius:16px;padding:20px;border:2px solid var(--line);display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:500;background:var(--surface-2);border-radius:99px;padding:4px 12px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line)}
.dots i.ok{background:var(--ok);border-color:var(--ok)} .dots i.ko{background:var(--red);border-color:var(--red)} .dots i.now{border-color:var(--court)}
.prompt{font-size:14px;color:var(--muted);margin:0}
.sentence{font-size:clamp(20px,4.6vw,26px);line-height:1.9;display:flex;flex-wrap:wrap;gap:6px 6px}
.w{border:2px solid transparent;background:var(--surface-2);border-radius:8px;padding:0 8px;font-size:inherit}
.w:hover{border-color:var(--court)}
.w.picked-ko{background:var(--ko-bg);border-color:var(--red)}
.w.fix{background:var(--ok-bg);border-color:var(--ok)}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--court);text-align:center;color:var(--court);font-weight:700}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choice{background:var(--surface-2);border:2px solid var(--line);border-radius:10px;padding:10px 16px;font-size:19px;font-weight:500}
.choice:hover{border-color:var(--court)}
.choice.good{background:var(--ok-bg);border-color:var(--ok)} .choice.bad{background:var(--ko-bg);border-color:var(--red)}
.zero{align-self:flex-start;background:transparent;border:2px dashed var(--court);color:var(--court);border-radius:10px;padding:8px 14px;font-weight:700}
.zero.good{background:var(--ok-bg);border-style:solid;border-color:var(--ok);color:var(--ok)} .zero.bad{background:var(--ko-bg);border-style:solid;border-color:var(--red);color:var(--red)}
#fb{display:flex;flex-direction:column;gap:12px}
.feedback{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg)} .feedback.ko{background:var(--ko-bg)}
.feedback b.v{font-size:18px}
.feedback .why{margin:0}
.primary{align-self:flex-end;background:var(--ball);color:var(--ball-ink);border:0;border-radius:12px;padding:12px 22px;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.03em}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:2px solid var(--line);border-radius:10px;padding:8px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.end{text-align:center;align-items:center}
.end .big{font-family:var(--display);font-weight:400;font-size:56px;line-height:1;color:var(--court)}
.end .xp{font-family:var(--display);font-weight:400;font-size:22px;background:var(--ball);color:var(--ball-ink);border-radius:10px;padding:4px 14px}

textarea{width:100%;min-height:72px;font:inherit;font-size:21px;line-height:1.6;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.names{font-size:14px;background:var(--surface-2);border-radius:8px;padding:6px 10px;align-self:flex-start}
.passes{display:grid;gap:8px}
.pass{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:10px 12px;cursor:pointer}
.pass input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.pass .code{font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;font-weight:700;color:var(--red);font-size:22px;line-height:1;width:22px;flex:none}
.pass span small{display:block;color:var(--muted);font-size:13px}
.diff{font-size:21px;line-height:2.4;display:flex;flex-wrap:wrap;gap:4px 8px}
.diff .g{color:var(--ok)}
.diff .x{display:inline-flex;flex-direction:column;line-height:1.15;text-align:center;background:var(--ko-bg);border-radius:8px;padding:2px 8px}
.diff .x s{color:var(--red)} .diff .x em{font-style:normal;font-weight:700;color:var(--ok);font-size:17px}
.flash{font-size:24px;font-weight:500;text-align:center;padding:16px;background:var(--surface-2);border-radius:10px}

/* Arcade */
.arc{background:var(--space);border-color:var(--space);color:var(--space-ink);padding:14px}
.arc .ghost{border-color:#2c3766;color:var(--space-ink)}
.arc .pill{background:#1a2250;color:var(--space-ink)}
.stage{position:relative;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:12px;text-align:center;padding:24px;background:rgba(7,10,26,.82);color:var(--space-ink)}
.ov[hidden]{display:none}
.ov h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,44px);line-height:1;margin:0;color:var(--ball);letter-spacing:.03em}
.ov p{margin:0;max-width:34ch;color:#c9d3f5}
.ov .big{font-family:var(--display);font-weight:400;font-size:48px;color:var(--space-ink);line-height:1}
.ov .ghost{border-color:#3a4785;color:var(--space-ink)}
.skins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.skin{display:flex;flex-direction:column;align-items:center;gap:2px;background:#141b44;border:2px solid #2c3766;border-radius:10px;padding:6px 8px;color:var(--space-ink);font-size:12px;min-width:74px}
.skin.on{border-color:var(--ball);background:#24305f}
.skin:disabled{opacity:.45;cursor:not-allowed}
.skin canvas{width:56px;height:56px}
.pad{display:flex;gap:12px;align-items:stretch}
.fire{flex:1;min-height:84px;border:0;border-radius:18px;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.08em;color:#2a1600;background:radial-gradient(circle at 50% 30%,#ffe08a,#ffc23c 45%,#e08a00);box-shadow:0 6px 0 #9a5a00,0 0 24px rgba(255,194,60,.45);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (hover:hover) and (pointer:fine){.fire{min-height:56px;font-size:20px}}
.fire.on{transform:translateY(4px);box-shadow:0 2px 0 #9a5a00,0 0 36px rgba(255,194,60,.8)}
.megabtn{width:110px;border-radius:18px;border:2px solid #ff9f3c;background:#2a1606;color:#ffd9b0;font-size:13px;line-height:1.3;touch-action:manipulation}
.megabtn b{font-family:var(--display);font-weight:400;font-size:22px;color:#ff9f3c}
.megabtn:disabled{opacity:.4;border-color:#5a3a1a}
#arcCard:fullscreen{overflow:auto;border-radius:0;max-width:none;width:100%;height:100%}
.arc .top .ghost{padding:6px 10px;font-size:14px}
.arc .help{font-size:13px;color:#a8b4de;margin:0}

.chart-wrap{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--body);font-size:12px}
.add{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.add label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
.add input{font:inherit;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:120px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--surface-2);border:2px solid transparent;border-radius:99px;padding:4px 12px;font-size:14px}
.tab.on{border-color:var(--court);color:var(--court);font-weight:700}
.stbl-wrap{overflow-x:auto}
.stbl{width:100%;border-collapse:collapse;font-size:15px}
.stbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:2px solid var(--line)}
.stbl td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.stbl .num{font-variant-numeric:tabular-nums}
.stbl .up{color:var(--ok);font-weight:700} .stbl .down{color:var(--red);font-weight:700}
.cmark{display:inline-block;width:22px;font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;font-weight:700;color:var(--red)}
.statmsg{margin:0;font-weight:500}
@media (max-width:480px){.stbl th:nth-child(5),.stbl td:nth-child(5){display:none}.stbl td,.stbl th{padding:6px 5px}.stbl{font-size:14px}}
.earnhelp{color:#c9d3f5;font-size:14px} .earnhelp ul{margin:8px 0;padding-left:20px} .earnhelp p{margin:0}
.earn{font-family:var(--display);font-weight:400;color:var(--ball);font-size:20px}
.mini{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;background:transparent;color:inherit;opacity:.85;margin-left:6px}
.mission.defi{grid-column:1/-1;border-color:var(--ball);background:linear-gradient(120deg,color-mix(in srgb,var(--ball) 22%,var(--surface)),var(--surface))}
.mission.defi .mark{color:var(--ball);font-family:var(--display);font-weight:400;transform:none;font-size:36px}
.mission.side .mark{color:var(--court);font-family:var(--body);font-weight:700;transform:none;font-size:34px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.trophy{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 8px;border-radius:12px;background:var(--surface-2);opacity:.55}
.trophy.on{opacity:1;background:color-mix(in srgb,var(--ball) 18%,var(--surface));box-shadow:0 0 0 2px var(--ball) inset}
.trophy b{font-size:14px} .trophy small{font-size:12px;color:var(--muted)}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;width:max-content;max-width:calc(100vw - 32px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 18px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:2px solid var(--ball);transition:opacity .4s,transform .4s}
.toast b{color:var(--ball)} .toast.out{opacity:0;transform:translateY(10px)}
.hgc{display:block;width:100%;border-radius:12px}
.hgh{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.06em;color:#b9c5ec;margin:6px 0 -4px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:#141b44;border:2px solid #2c3766;border-radius:12px;padding:10px;color:var(--space-ink);text-align:left}
.item small{color:var(--ball);font-weight:700} .item.eq{border-color:var(--ball);background:#24305f} .item.eq small{color:#4ee08f} .item.poor{opacity:.55}
.sw{display:block;width:100%;height:8px;border-radius:99px}
.duel .dtitle{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,32px);margin:0;color:var(--court)}
.dform{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.dform label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
.dform input{font:inherit;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:150px}
.dscore{display:flex;justify-content:center;gap:24px;font-size:18px} .dscore b{font-family:var(--display);font-weight:400;color:var(--court);margin-left:6px}
.dscore.big2{font-size:22px}
.dres{display:flex;justify-content:space-between;gap:10px;border-radius:10px;padding:10px 14px}
.dres.ok{background:var(--ok-bg)} .dres.ko{background:var(--ko-bg)}
body.arcade .board{display:none}
body.arcade .app{max-width:1100px}
body.arcade .arc{padding:10px;gap:10px}
.fsbtn{white-space:nowrap}
body.choosing .board{display:none}
body.guest .board .stats,body.guest .board .lvl-row,body.guest .board .bar{display:none}
.chooser{display:flex;flex-direction:column;gap:16px}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ch-title{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,52px);line-height:.95;margin:0;color:var(--ink)}
.ch-title span{color:var(--court)}
.who-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.who-grid{grid-template-columns:1fr}}
.who-card{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:2px 14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;transition:border-color .15s,transform .15s}
.who-card:hover{border-color:var(--court)}
.who-card.on{border-color:var(--court);box-shadow:0 0 0 3px color-mix(in srgb,var(--court) 25%,transparent);transform:translateY(-2px)}
.who-card b{font-size:20px} .who-card small{grid-column:2;color:var(--muted);font-size:13px;line-height:1.35}
.avatar{grid-row:1/3;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#fff}
.av-vincent{background:linear-gradient(135deg,#2459d6,#5fd3ff)} .av-alexandre{background:linear-gradient(135deg,#7a3cff,#ff7ad9)} .av-guest{background:linear-gradient(135deg,#ff9f3c,#ffc23c);color:#3a2a00}
.lvl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.lvl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lvl-chip{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.lvl-chip .lvl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvl-chip b{font-family:var(--display);font-weight:400;font-size:20px}
.lvl-chip i{font-style:normal;font-weight:700;color:var(--court);font-variant-numeric:tabular-nums}
.lvl-chip small{color:var(--muted);font-size:12.5px;line-height:1.3}
.lvl-chip.on{border-color:var(--ball);background:color-mix(in srgb,var(--ball) 16%,var(--surface))}
.lvl-chip:disabled{opacity:.42;cursor:not-allowed}
.lvl-hint{margin:-6px 0 2px;color:var(--muted);font-size:14px}
.go-big{align-self:stretch;font-size:22px;padding:16px}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb-row{display:grid;grid-template-columns:32px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.lb-row:nth-child(1){background:color-mix(in srgb,var(--ball) 30%,var(--surface))}
.lb-row:nth-child(2){background:color-mix(in srgb,#c0c7d6 35%,var(--surface))}
.lb-row:nth-child(3){background:color-mix(in srgb,#d08a4a 28%,var(--surface))}

/* Toutes les questions à choix d'un niveau, avec leur catégorie (src), un sous-type (sub) et un identifiant stable */
function levelChoices(level){
  let list;
  if(isPrim(level)){ const P=PRIM[level]; list=[
    ...P.mordre.map(q=>({...q,src:"I"})),
    ...P.jumeaux.map(q=>({...q,src:"H"})),
    ...P.accords.map(q=>({...q,src:"A"})),
    ...P.nombres.map(q=>({...q,src:"A",sub:"N"})),
    ...P.motjuste.map(q=>({...q,src:"V"}))] }
  else {
    const low=level==="6e"||level==="5e"||level==="4e";
    list=[
      ...(BANK[level]||[]).map(q=>({...q,src:q.c})),
      ...NOMBRES_COL.filter(q=>low||q.h).map(q=>({...q,src:"A",sub:"N"})),
      ...(low?HOMO_COL:[]).map(q=>({...q,src:"H"})),
      ...(level==="5e"||level==="6e"?MOTJUSTE_CM2:[]).concat(MOTJUSTE_COL).map(q=>({...q,src:"V"}))];
  }
  return list.map(q=>({...q,id:qid(q)}));
}
/* Chasse aux fautes : au CM2 les phrases écrites à la main ; au-delà, dérivées des questions
   (3 phrases sur 4 contiennent la faute la plus tentante, 1 sur 4 est juste) */
function chassePool(level){
  if(isPrim(level)) return PRIM[level].chasse.map(c=>[c[0],c[1],chasseCat(c[0])]);
  return (BANK[level]||[]).map((q,i)=>{
    const right=q.o[q.a];
    if(i%4===3) return [q.s.replace("___",right),"Zéro faute ! "+q.w,q.c];
    const wrongs=q.o.filter((_,k)=>k!==q.a), wrong=wrongs[i%wrongs.length];
    return [q.s.replace("___","{"+wrong+"|"+right+"}"),q.w,q.c];
  });
}

/* =====================================================================
   GÉNÉRATEUR : environ une phrase sur quatre est fabriquée au hasard
   (personnages, verbes, objets). Impossible à apprendre par cœur :
   il faut appliquer la règle. Les phrases générées peuvent être absurdes
   (c'est voulu) et ne vont jamais dans les pièges.

const GEN={
 subj:[["Le Pokémon","m",1],["La championne","f",1],["Les ninjas","m",2],["Les joueuses","f",2],["La princesse","f",1],["Le gardien","m",1],
  ["Mes cartes Pokémon","f",2],["Les dragons","m",2],["Ma petite sœur","f",1],["Les supporters","m",2],["Le détective","m",1],["Les manettes","f",2],
  ["Les pizzas","f",2],["Le ballon","m",1],["Le chevalier","m",1],["Les statues","f",2],["Mon chat","m",1],["Les sorcières","f",2],["Le trophée","m",1],["Les crêpes","f",2]],
 verbs:["attraper","réveiller","décorer","capturer","emporter","fêter","féliciter","chatouiller","transporter","oublier","cacher","photographier",
  "filmer","admirer","déguiser","gronder","inviter","porter","sauver","soigner","piéger","encourager","dessiner","retrouver","arrêter"],
 agents:["Conan","un dragon","Sacha","la maîtresse","Tanjiro","un Ronflex","Luffy","mon grand frère","Goku","un ninja"],
 obj:[["le ballon","m",1],["la princesse","f",1],["les cartes","f",2],["les ninjas","m",2],["trois pizzas","f",2],["le trophée","m",1],
  ["la manette","f",1],["les dragons","m",2],["les supporters","m",2],["la sorcière","f",1]],
 aux:["veut","va","doit","peut"],
 adj:["fatigué","content","prêt","petit","grand","fort","épuisé","endormi","affamé","déçu","ravi","perdu"],
 tails:[""," après le match"," ce matin"," depuis hier"," comme d'habitude"],
 cod:[["Les cartes","f",2,"sont rares"],["La pizza","f",1,"était froide"],["Les dragons","m",2,"dorment enfin"],["Le trophée","m",1,"brille sur l'étagère"],
  ["Les manettes","f",2,"ne marchent plus"],["La princesse","f",1,"remercie tout le monde"],["Les indices","m",2,"mènent au coupable"],
  ["La lettre","f",1,"vient de Poudlard"],["Les crêpes","f",2,"sont délicieuses"],["Le ballon","m",1,"est crevé"]],
 codVerbs:["trouver","cacher","oublier","photographier","filmer","dessiner","retrouver","transporter","admirer","décorer","emporter"]
};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const GN={m1:"masculin singulier",f1:"féminin singulier",m2:"masculin pluriel",f2:"féminin pluriel"};
const ppOf=(inf,g,n)=>inf.slice(0,-2)+"é"+(g==="f"?"e":"")+(n===2?"s":"");
const adjOf=(a,g,n)=>a+(g==="f"?"e":"")+(n===2?"s":"");
const uniq=a=>[...new Set(a)];
function genPack(s,opts,right,w,src){
  const o=uniq(opts); return {s,o,a:o.indexOf(right),w,src,gen:true,id:"g"+Math.random().toString(36).slice(2,9)};
}
/* Participe après être : « Les joueuses sont filmées par Conan. » */
function genEtre(){
  const [S,g,n]=rnd(GEN.subj), v=rnd(GEN.verbs); let ag=rnd(GEN.agents);
  while(ag.toLowerCase()===S.toLowerCase()) ag=rnd(GEN.agents);
  const right=ppOf(v,g,n), extra=n===2?ppOf(v,g==="f"?"m":"f",2):ppOf(v,g,2);
  const w=`« ${n===2?"sont":"est"} mordu${g==="f"?"e":""}${n===2?"s":""} », donc « é ». Qui ? ${S} : ${GN[g+n]}, donc « ${right} ».`;
  return genPack(`${S} ${n===2?"sont":"est"} ___ par ${ag}.`,[v,ppOf(v,"m",1),right,extra],right,w,"I");
}
/* Participe après avoir, COD après le verbe : « Conan a filmé les joueuses. » */
function genAvoir(){
  const v=rnd(GEN.verbs), ag=cap(rnd(GEN.agents)), [o,g,n]=rnd(GEN.obj);
  const right=ppOf(v,"m",1), trap=(g==="m"&&n===1)?ppOf(v,"m",2):ppOf(v,g,n);
  return genPack(`${ag} a ___ ${o}.`,[v,right,trap],right,`« a mordu », donc « é ». Avec avoir, pas d'accord avec ce qui vient après : « a ${right} ${o} ».`,"I");
}
/* Infinitif : « Luffy veut attraper la princesse. » / « … court pour … » */
function genInf(){
  const v=rnd(GEN.verbs), ag=cap(rnd(GEN.agents)), [o,g,n]=rnd(GEN.obj), r=Math.random();
  let s,w;
  if(r<0.6){ const x=rnd(GEN.aux); s=`${ag} ${x} ___ ${o}.`; w=`« ${x} mordre », donc « er ».` }
  else if(r<0.85){ s=`${ag} court pour ___ ${o}.`; w="« pour mordre », donc « er ». Après pour, sans, à, de : toujours l'infinitif." }
  else { s=`${ag} repart sans ___ ${o}.`; w="« sans mordre », donc « er ». Après sans, pour, à, de : toujours l'infinitif." }
  const trap=(g==="m"&&n===1)?ppOf(v,"f",1):ppOf(v,g,n);
  return genPack(s,[v,ppOf(v,"m",1),trap],v,w,"I");
}
/* Adjectif attribut : « Les joueuses sont fatiguées après le match. » */
function genAdj(){
  const [S,g,n]=rnd(GEN.subj), a=rnd(GEN.adj), right=adjOf(a,g,n);
  return genPack(`${S} ${n===2?"sont":"est"} ___${rnd(GEN.tails)}.`,[adjOf(a,"m",1),adjOf(a,"f",1),adjOf(a,"m",2),adjOf(a,"f",2)],right,
    `Qui est ${a} ? ${S} : ${GN[g+n]}, donc « ${right} ».`,"A");
}
/* Collège : COD placé avant avoir. « Les cartes que Sacha a trouvées sont rares. » */
function genCOD(){
  const [O,g,n,tail]=rnd(GEN.cod), v=rnd(GEN.codVerbs), ag=rnd(GEN.agents), right=ppOf(v,g,n);
  const others=[ppOf(v,"m",1),ppOf(v,g==="f"?"m":"f",n),ppOf(v,g,n===2?1:2),v].filter(x=>x!==right);
  const w=`Avec avoir, le participe s'accorde avec le COD seulement s'il est placé avant. Ici, « que » remplace « ${O.toLowerCase()} » (${GN[g+n]}), placé avant : « ${right} »${g==="m"&&n===1?", sans marque visible":""}.`;
  return genPack(`${O} ${/^[aeiouyéèêàâîôû]/i.test(ag)?"qu'":"que "}${ag} a ___ ${tail}.`,[right,...others.slice(0,3)],right,w,"A");
}
/* Une question générée de la catégorie demandée, selon la classe */
function genChoice(cat){
  const L=PROFILE.level;
  if(cat==="I"){ if(L==="ce2") return genSimpleI(); return isPrim(L)?rnd([genEtre,genEtre,genAvoir,genInf])():null }
  if(cat==="A"){ if(isPrim(L)) return genAdj(); if(L==="6e") return Math.random()<0.5?genEtre():genCOD(); return L==="5e"&&Math.random()<0.4?genEtre():genCOD() }
  return null;
}
/* CE2 : seulement -er ou -é, sans accord (« Le dragon a ___ » / « Le dragon va ___ ») */
function genSimpleI(){
  const v=rnd(GEN.verbs), ag=cap(rnd(GEN.agents)), [o]=rnd(GEN.obj), r=Math.random();
  if(r<0.5){ const right=ppOf(v,"m",1); return genPack(`${ag} a ___ ${o}.`,[v,right],right,`« a mordu » (pas « a mordre »), donc « é ».`,"I") }
  const x=rnd(GEN.aux); return genPack(`${ag} ${x} ___ ${o}.`,[v,ppOf(v,"m",1)],v,`« ${x} mordre » (pas « ${x} mordu »), donc « er ».`,"I");
}
/* Version « chasse aux fautes » : 3 fois sur 4 la faute la plus tentante, 1 fois sur 4 zéro faute */
function genChasse(){
  const q=genChoice(isPrim(PROFILE.level)?rnd(["I","I","A"]):"A");
  const right=q.o[q.a];
  if(Math.random()<0.25) return {it:[q.s.replace("___",right),"Zéro faute ! "+q.w],cat:q.src};
  const wrong=rnd(q.o.filter((_,k)=>k!==q.a));
  return {it:[q.s.replace("___","{"+wrong+"|"+right+"}"),q.w],cat:q.src};
}

/* =====================================================================
   IDENTIFIANTS STABLES ET RÉPÉTITION ESPACÉE
   Chaque question a un identifiant tiré de son texte : il ne bouge pas
   quand les listes changent d'ordre. Une question ratée entre dans une
   boîte (méthode Leitner) et revient le lendemain, puis de plus en plus
   espacée tant qu'elle est réussie.
   ===================================================================== */
const QID_CACHE=new Map();
function qkey(it){
  if(typeof it==="string") return "d:"+it;                 // phrase de dictée
  if(Array.isArray(it)) return "c:"+it[0];                 // phrase de la chasse
  if(it.t==="word") return "w:"+it.w.trim().toLowerCase(); // mot à retenir
  if(it.t==="text") return "r:"+it.x;                      // texte de relecture
  return "q:"+it.s+"|"+it.o[it.a];                         // question à choix
}
function qid(it){
  const k=qkey(it); let h=QID_CACHE.get(k); if(h) return h;
  let a=5381,b=7; for(let i=0;i<k.length;i++){ const c=k.charCodeAt(i); a=((a<<5)+a+c)|0; b=(Math.imul(b,31)+c)|0 }
  h=(a>>>0).toString(36)+((b>>>0)%46656).toString(36);
  QID_CACHE.set(k,h); return h;
}
/* Numéro du jour (jours depuis 1970, heure locale) */
function dayNum(d){ d=d||new Date(); return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5) }
/* Boîtes : S.box[id] = [boîte, jour de la prochaine révision]. Boîte 6 = maîtrisé. */
const GAPS=[0,1,1,2,4,8,16];
const MASTER=6;
function leitner(id,ok,learn){
  if(!id||!S.box) return;
  const today=dayNum(), cur=S.box[id];
  if(!ok){ S.box[id]=[1,today+1]; return }
  if(!cur){ if(learn) S.box[id]=[2,today+GAPS[2]]; return }   // jamais raté : rien à suivre (sauf un mot à apprendre)
  if(cur[1]>today) return;                                    // pas encore l'heure de la révision : on ne monte pas
  const b=Math.min(MASTER,cur[0]+1);
  S.box[id]=[b, b>=MASTER?today+30:today+GAPS[b]];
}
/* Migration : les erreurs déjà notées dans le Mot Blaster deviennent les premiers pièges */
function seedBox(miss){
  const box={}, today=dayNum();
  const lists={bm:MORDRE,bj:JUMEAUX,ba:ACCORDS,acc:ACCORDS,mordre:MORDRE,jumeaux:JUMEAUX,chasse:CHASSE,dictee:DICTEES};
  // les toutes premières versions rangeaient autrement les questions : on ne reprend que les numéros sûrs
  const V2LEN={mordre:20,jumeaux:18,chasse:30,dictee:12}, STABLE={mordre:[0,1,2,3,4],jumeaux:[0,1,2,3,4,5,6],chasse:[0,1,2,5,6,7,9,11,12],dictee:[0,4]};
  Object.entries(miss||{}).forEach(([k,n])=>{
    if(!(n>0)) return;
    let m=k.match(/^(bm|bj|ba|acc|mordre|jumeaux|chasse|dictee)(\d+)$/), q=null;
    if(m){ const p=m[1], i=+m[2]; if(!V2LEN[p]||i>=V2LEN[p]||STABLE[p].includes(i)||n>2) q=lists[p][i] }
    else if((m=k.match(/^(5e|4e|3e|2nde|expert)-(\d+)$/))) q=(BANK[m[1]]||[])[+m[2]];
    if(q) box[qid(q)]=[1,today+(Object.keys(box).length%5)];   // étalés sur 5 jours, pas tous d'un coup
  });
  return box;
}

let REF=null, canWrite=false, writing=false, pending=false;

async function pushRemote(){
  if(!REF||!canWrite) return;
  if(writing){pending=true;return}
  writing=true;
  try{ await REF.set(JSON.parse(JSON.stringify(S))); syncLabel("Progression sauvegardée sur le compte") }

/* =====================================================================
   SUIVI : chaque réponse est notée par catégorie et par jour
   A = accords · I = é/er · H = homophones · D = dictée
   ===================================================================== */
const CATS={A:"Accords",I:"é ou er",H:"Homophones",C:"Conjugaison",D:"Dictée",W:"Mots à retenir",V:"Le mot juste"};
const HOMO=new Set(["a","à","A","À","et","est","Et","Est","on","ont","On","Ont","son","sont","Son","Sont","peu","peut","ou","où","Ou","Où","ces","ses","Ces","Ses","ce","se","Ce","Se","mes","mais","Mes","Mais","la","là","l'a","La","Là"]);
function chasseCat(s){
  const m=s.match(/\{([^|}]+)\|([^}]+)\}/); if(!m) return "A";
  const [x,y]=[m[1],m[2]];
  if(HOMO.has(x)&&HOMO.has(y)) return "H";
  const er=/er$/, pp=/(é|ée|és|ées)$/;
  if((er.test(x)&&pp.test(y))||(pp.test(x)&&er.test(y))) return "I";
  return "A";
}
function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function logAnswer(cat,ok,slow){
  const k=dayKey(); S.log=S.log||{}; const day=S.log[k]=S.log[k]||{};
  const c=day[cat]=day[cat]||[0,0]; c[1]++; if(ok) c[0]++; if(slow) c[2]=(c[2]||0)+1;
  S.dirty=true; saveLocal();
}
function periodKey(dk,per){
  if(per==="jour") return dk;
  if(per==="mois") return dk.slice(0,7);

function periodLabel(k,per){

  });

}

function drawStats(){
  const el=$("#stats"); if(!el) return;

  const tabs=["jour","semaine","mois"].map(p=>`<button class="tab${p===statPer?" on":""}" data-p="${p}">${p==="jour"?"Par jour":p==="semaine"?"Par semaine":"Par mois"}</button>`).join("");

  const cur=keys[keys.length-1], prev=keys[keys.length-2];
  const pct=(o,c)=>{const x=o&&o[c]; return x&&x[1]?Math.round(x[0]/x[1]*100):null};
  const rows=Object.entries(CATS).filter(([c])=>profileCats().includes(c)).map(([c,name])=>{
    const p=pct(agg[cur],c), pp=pct(agg[prev],c), x=(agg[cur]||{})[c]||[0,0];
    const delta=(p!=null&&pp!=null)?p-pp:null;
    const spark=keys.slice(-8).map(k=>pct(agg[k],c));
    return {c,name,p,pp,delta,err:x[1]-x[0],tot:x[1],slow:x[2]||0,spark};
  });

    const pts=s.map((v,i)=>v==null?null:[4+i*(92/Math.max(1,s.length-1)),26-v*0.22]).filter(Boolean);

  };

  if(best&&worst&&best!==worst) msg+=`Point fort : ${best.name}. À travailler : ${worst.name}.`;
  else if(best) msg+=`Point fort : ${best.name}.`;

    <div class="stbl-wrap"><table class="stbl"><thead><tr><th>Catégorie</th><th>Réussite</th><th>Erreurs</th><th>Évol.</th><th>Tendance</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><span class="cmark">${r.c}</span>${r.name}</td>

const SFX={ctx:null,master:null,mGain:null,timer:null,step:0,next:0,boss:false,zone:0};
function audio(){
  if(!S.sound) return null;
  try{
    if(!SFX.ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      SFX.ctx=new AC(); SFX.master=SFX.ctx.createGain(); SFX.master.gain.value=0.45; SFX.master.connect(SFX.ctx.destination);
      SFX.mGain=SFX.ctx.createGain(); SFX.mGain.gain.value=0.16; SFX.mGain.connect(SFX.master);
    }
    if(SFX.ctx.state==="suspended") SFX.ctx.resume();
    return SFX.ctx;
  }catch(e){ return null }
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,dur,type,vol,f2,delay,dest){
  const c=audio(); if(!c) return;
  const t0=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(dest||SFX.master); o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur,vol,freq,delay,dest){
  const c=audio(); if(!c) return;
  const t0=c.currentTime+(delay||0), n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=buf; f.type="lowpass"; f.frequency.value=freq||2000; g.gain.value=vol||0.3;
  s.connect(f); f.connect(g); g.connect(dest||SFX.master); s.start(t0);
}
function sfx(name){
  if(!S.sound) return;
  switch(name){
    case "shoot1": tone(880,0.07,"square",0.06,440); break;
    case "shoot2": tone(1100,0.08,"sawtooth",0.05,550); tone(1320,0.06,"square",0.03,660,0.01); break;
    case "shoot3": tone(660,0.12,"sawtooth",0.06,220); tone(1760,0.08,"sine",0.05,880); break;
    case "good": [72,76,79,84].forEach((m,i)=>tone(mf(m),0.12,"square",0.09,null,i*0.06)); break;
    case "bad": tone(160,0.35,"sawtooth",0.14,70); noise(0.2,0.12,600); break;
    case "boom": noise(0.6,0.4,900); tone(110,0.4,"sine",0.2,40); break;
    case "bigboom": noise(1.2,0.5,1200); tone(90,0.9,"sine",0.3,30); [60,64,67,72,76].forEach((m,i)=>tone(mf(m),0.18,"square",0.07,null,0.3+i*0.08)); break;
    case "bonus": [84,88,91,96].forEach((m,i)=>tone(mf(m),0.08,"triangle",0.08,null,i*0.04)); break;
    case "shield": tone(300,0.25,"triangle",0.15,120); noise(0.15,0.15,3000); break;
    case "life": [67,71,74,79,83].forEach((m,i)=>tone(mf(m),0.14,"square",0.08,null,i*0.07)); break;
    case "boss": tone(110,0.9,"sawtooth",0.12,220); tone(116,0.9,"sawtooth",0.1,233); break;
    case "warp": tone(120,1.8,"sawtooth",0.08,1600); noise(1.8,0.08,4000); break;
    case "mega": noise(0.9,0.5,2500); tone(60,0.8,"sine",0.3,30); break;
    case "click": tone(1200,0.03,"square",0.03); break;
    case "trophy": [72,76,79,84,88].forEach((m,i)=>tone(mf(m),0.2,"triangle",0.1,null,i*0.09)); tone(mf(96),0.5,"sine",0.06,null,0.45); break;
    case "tick": tone(1500,0.03,"sine",0.04); break;

}
/* Musique : basse + arpège, plus rapide et plus tendue pendant les boss */
const ROOTS=[45,43,48,40,41,46];
function musicStart(){ if(!S.sound||!audio()) return; musicStop(); SFX.step=0; SFX.next=SFX.ctx.currentTime+0.1; SFX.timer=setInterval(musicTick,25) }
function musicStop(){ if(SFX.timer){clearInterval(SFX.timer); SFX.timer=null} }
function musicTick(){
  const c=SFX.ctx; if(!c||!S.sound){musicStop();return}
  const bpm=SFX.boss?148:118, st=60/bpm/4;
  while(SFX.next<c.currentTime+0.12){
    const s=SFX.step%64, bar=Math.floor(s/16), root=ROOTS[SFX.zone%ROOTS.length]+[0,-4,3,-2][bar], i=s%16, d=SFX.next-c.currentTime;
    if(i%2===0) tone(mf(root-12+(i%8===6?12:0)),st*1.6,"triangle",0.5,null,d,SFX.mGain);
    const arp=SFX.boss?[0,3,7,10]:[0,3,7,12]; tone(mf(root+24+arp[i%4]+(SFX.boss&&i>=8?1:0)),st*0.9,"square",0.14,null,d,SFX.mGain);
    if(i%4===0) noise(0.08,SFX.boss?0.9:0.5,SFX.boss?180:150,d,SFX.mGain);
    if(i%4===2) noise(0.03,0.25,7000,d,SFX.mGain);
    SFX.step++; SFX.next+=st;
  }
}

    const dc=shopItem(S.equip.decal); if(dc) drawDecal(ctx,x,y+2*1.3,dc.shape,1.3);
    HG.raf=requestAnimationFrame(frame);
  };
  HG.raf=requestAnimationFrame(frame);
}

    const all=levelChoices(PROFILE.level);
    D={names:[p1,p2],scores:[0,0],round:0,qs:shuffle(all).slice(0,5),turn:0,res:[]};

}
function isMe(n){ return !isGuest() && String(n).trim().toLowerCase()===PROFILES[PROFILE.id].name.toLowerCase() }
function duelPass(){
  const who=D.names[D.turn];
  screen.innerHTML=`<div class="card duel end">
    <p class="prompt">Manche ${D.round+1} / 5</p>
    <h2 class="dtitle">Au tour de ${esc(who)}</h2>
    <p>${esc(D.names[1-D.turn])}, tourne la tête !</p>
    <div class="dscore"><span>${esc(D.names[0])} <b>${D.scores[0]}</b></span><span>${esc(D.names[1])} <b>${D.scores[1]}</b></span></div>
    <button class="primary" id="ready" style="align-self:center">${esc(who)} est prêt</button></div>`;
  $("#ready").onclick=()=>{ sfx("click"); duelQuestion() };
}
function duelQuestion(){
  const q=D.qs[D.round], parts=q.s.split("___"), t0=performance.now();
  screen.innerHTML=`<div class="card duel">
    <div class="top"><span class="pill">${esc(D.names[D.turn])} · manche ${D.round+1} / 5</span><span class="pill" id="dtime">0,0 s</span></div>
    <div class="sentence"><span>${esc(parts[0])}<span class="blank">?</span>${esc(parts[1]||"")}</span></div>
    <div class="choices">${shuffle(q.o.map((o,k)=>({o,k}))).map(c=>`<button class="choice" data-k="${c.k}">${esc(c.o)}</button>`).join("")}</div></div>`;
  const iv=setInterval(()=>{const el=$("#dtime"); if(!el){clearInterval(iv);return} el.textContent=((performance.now()-t0)/1000).toFixed(1).replace(".",",")+" s"},100);
  screen.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    clearInterval(iv);
    const secs=(performance.now()-t0)/1000, ok=+b.dataset.k===q.a;
    const pts=ok?100+Math.max(0,Math.round(60-secs*8)):0;
    D.scores[D.turn]+=pts; D.res[D.turn]={ok,secs,pts};
    if(isMe(D.names[D.turn])){ logAnswer(q.src,ok); leitner(q.id,ok) }
    sfx(ok?"good":"bad");
    if(D.turn===0){ D.turn=1; duelPass() } else duelReveal();
  });
}
function duelReveal(){
  const q=D.qs[D.round], ans=q.o[q.a];
  const line=i=>{const r=D.res[i]; return `<div class="dres ${r.ok?"ok":"ko"}"><b>${esc(D.names[i])}</b><span>${r.ok?"Juste":"Raté"} · ${r.secs.toFixed(1).replace(".",",")} s</span><b>+${r.pts}</b></div>`};
  screen.innerHTML=`<div class="card duel">
    <p class="prompt">Manche ${D.round+1} / 5 · réponse : <b>${esc(q.s.replace("___",ans))}</b></p>
    ${line(0)}${line(1)}
    <p class="why">${esc(q.w)}</p>
    <div class="dscore"><span>${esc(D.names[0])} <b>${D.scores[0]}</b></span><span>${esc(D.names[1])} <b>${D.scores[1]}</b></span></div>
    <button class="primary" id="dnext">${D.round<4?"Manche suivante":"Résultat final"}</button></div>`;
  $("#dnext").onclick=()=>{ D.round++; D.turn=0; D.res=[]; if(D.round<5) duelPass(); else duelEnd() };
}
function duelEnd(){
  const [a,b]=D.scores, win=a===b?-1:(a>b?0:1);
  if(win>=0 && isMe(D.names[win])){ S.cnt.duel++; S.xp+=50; D.stars=touchStreak()+earn(3); D.fuel=earnFuel(1) }
  checkTrophies(); save(); renderBoard(); sfx(win>=0?"trophy":"good");
  screen.innerHTML=`<div class="card duel end">
    <h2 class="dtitle">${win<0?"Égalité parfaite !":esc(D.names[win])+" gagne le duel !"}</h2>
    <div class="dscore big2"><span>${esc(D.names[0])} <b>${a}</b></span><span>${esc(D.names[1])} <b>${b}</b></span></div>
    ${win>=0&&isMe(D.names[win])?`<div class="xp">+50 points · +${D.stars} ★</div>${D.fuel?`<p class="fuelwin">+1 carburant pour le Mot Blaster</p>`:""}`:""}
    <div class="row" style="justify-content:center"><button class="primary" id="drev">Revanche</button><button class="ghost" id="dback">Missions</button></div></div>`;
  $("#drev").onclick=openDuel; $("#dback").onclick=home;
}

/* ---------- Mots de la semaine : ils voyagent dans le lien (#mots=…), sans serveur ---------- */
function b64urlEncode(str){ let bin=""; new TextEncoder().encode(str).forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"") }
function b64urlDecode(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const bin=atob(s); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))) }
function parseWordLines(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).slice(0,40).map(l=>{ const [m,...rest]=l.split(";"); return [m.trim().slice(0,40),rest.join(";").trim().slice(0,200)] }).filter(x=>x[0]);
}
function wordsLink(title,pairs){ return location.origin+location.pathname+"#mots="+b64urlEncode(JSON.stringify({t:String(title||"").trim().slice(0,60),w:pairs})) }
function storeWords(title,words){
  let prev=null; try{ prev=JSON.parse(localStorage.getItem("cdf.mots")||"null") }catch(e){}
  const same=w=>words.some(n=>n.w.toLowerCase()===String(w.w).toLowerCase());
  const older=prev&&prev.mots?[...(prev.mots.words||[]),...(prev.mots.older||[])].filter(o=>o&&o.w&&!same(o)).slice(0,120):[];
  const mots={title:String(title||"").slice(0,60),words,older};
  try{ localStorage.setItem("cdf.mots",JSON.stringify({mots,carnet:[]})) }catch(e){}
  CONTENT={mots,carnet:[],ver:CONTENT.ver+1}; IDX=null;
  return mots;
}
function importWordsFromHash(){
  const m=location.hash.match(/^#mots=(.*)$/); if(!m) return null;
  history.replaceState(null,"",location.pathname+location.search);
  try{
    const o=JSON.parse(b64urlDecode(m[1].replace(/[^A-Za-z0-9_-]+$/,"")));   // une messagerie a pu coller un point à la fin du lien
    const words=(Array.isArray(o.w)?o.w:[]).slice(0,40).map(x=>Array.isArray(x)?{w:String(x[0]||"").trim().slice(0,40),s:String(x[1]||"").slice(0,200)}:null).filter(x=>x&&x.w);
    if(!words.length) throw 0;
    const mots=storeWords(typeof o.t==="string"?o.t:"",words);
    return {title:mots.title,n:words.length};
  }catch(e){ return {bad:true} }
}
function announceImport(imp){
  if(!imp) return;
  if(imp.bad){ toast("Lien des mots illisible","Demandez à nouveau le lien des mots de la semaine."); return }
  toast("Mots de la semaine ajoutés",(imp.title?imp.title+" · ":"")+imp.n+" mot"+(imp.n>1?"s":"")+" dans la mission Dictée");
}
/* Lien ouvert dans un onglet où le jeu tourne déjà : seul le # change, la page ne se recharge pas */
window.addEventListener("hashchange",()=>{
  const imp=importWordsFromHash(); if(!imp) return;
  announceImport(imp);
  if(!imp.bad && !R && !G && !document.body.classList.contains("choosing")) home();
});
function loadContentCache(){
  try{ const c=JSON.parse(localStorage.getItem("cdf.mots")||"null");
    if(c&&c.mots) CONTENT={mots:c.mots,carnet:[],ver:CONTENT.ver+1} }catch(e){}
}

  const pts=data.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ");

  const last=data[data.length-1], prev=data[data.length-2];
  const msg = prev ? (last.v>prev.v ? `+${(last.v-prev.v).toFixed(1).replace(".",",")} points depuis la dernière dictée.` : "La prochaine sera la bonne.") : "";
  el.innerHTML=`
    <p class="prompt">Tes dictées en classe, en % de réussite. ${msg}</p>

    </form>`;
  $("#addForm").onsubmit=e=>{e.preventDefault();const d=$("#addD").value.trim(),v=parseFloat($("#addV").value);
    if(!d||isNaN(v))return; S.classe.push({d,v}); save(); drawCurve();};

/* =====================================================================
   MANCHES
   Une manche = une liste d'entrées {it, kind, cat, id, gen, sub}
   kind : choice (question à choix) · chasse (trouver la faute) · dictee (phrase)
          word (mot à retenir) · relecture (texte à plusieurs fautes)
   ===================================================================== */
let R=null, IDX=null;
function entry(it,kind,cat,extra){
  const e={it,kind,cat,...(extra||{})};
  e.id=e.gen?(it.id||"g"+Math.random().toString(36).slice(2,9)):qid(it);
  return e;
}
const asChoice=list=>list.map(q=>entry(q,"choice",q.src||q.c,{sub:q.sub,gen:!!q.gen}));
function mixIn(list,extra){ const out=list.slice(); extra.forEach(x=>out.splice(Math.floor(Math.random()*(out.length+1)),0,x)); return out }
function genEntries(cat,n){ const out=[]; for(let i=0;i<n;i++){ const q=genChoice(cat); if(q) out.push(entry(q,"choice",q.src,{gen:true})) } return out }
const nGen=()=>Math.random()<0.5?1:2;   // 1 ou 2 phrases générées sur 6 à 8 : environ une sur quatre

/* Tirage sans répétition récente ; les pièges (boîtes 1-2) reviennent plus souvent, les questions maîtrisées moins */
function weightOf(e){ if(e.gen) return 1; const b=(S.box[e.id]||[0])[0]; return b===1?3:b===2?2:b>=5?0.6:1 }
function draw(key,pool,n){
  const keep=Math.max(0,pool.length-n), all=S.recent[key]||[];
  const recent=keep?all.slice(-keep):[], half=Math.floor(keep/2);
  let cand=pool.filter(e=>!recent.includes(e.id));
  if(cand.length<n){ const r2=half?recent.slice(-half):[]; cand=pool.filter(e=>!r2.includes(e.id)) }
  const out=[];
  while(out.length<Math.min(n,cand.length)){
    const left=cand.filter(e=>!out.includes(e)), w=left.map(weightOf);
    let r=Math.random()*w.reduce((a,b)=>a+b,0), k=0;
    for(;k<left.length-1;k++){ r-=w[k]; if(r<=0) break }
    out.push(left[k]);
  }
  S.recent[key]=all.concat(out.filter(e=>!e.gen).map(e=>e.id)).slice(-pool.length);
  return out;
}

/* ---------- Mots à retenir ---------- */
function cleanWord(x){ return x&&typeof x.w==="string"&&x.w.trim()&&x.w.length<=40?{t:"word",w:x.w.trim(),s:typeof x.s==="string"?x.s.slice(0,200):""}:null }
function wordEntries(){
  const m=CONTENT.mots, out=[];
  (m&&Array.isArray(m.words)?m.words:[]).map(cleanWord).filter(Boolean).forEach(w=>out.push(entry(w,"word","W",{weekly:true})));
  (m&&Array.isArray(m.older)?m.older:[]).map(cleanWord).filter(Boolean).forEach(w=>out.push(entry(w,"word","W",{older:true})));
  if(isPrim(PROFILE.level)) PRIM[PROFILE.level].mots.forEach(w=>out.push(entry({t:"word",...w},"word","W")));
  const seen=new Set(); return out.filter(e=>!seen.has(e.id)&&seen.add(e.id));
}
function pickWords(n){
  const all=wordEntries(), today=dayNum(), bx=e=>S.box[e.id];
  const due=e=>bx(e)&&bx(e)[0]<MASTER&&bx(e)[1]<=today, fresh=e=>!bx(e);
  const out=[], add=e=>{ if(out.length<n&&!out.includes(e)) out.push(e) };
  let nf=0; const addFresh=e=>{ if(nf<3&&out.length<n&&!out.includes(e)){ out.push(e); nf++ } };   // au plus 3 mots nouveaux d'un coup
  all.filter(e=>e.weekly&&due(e)).forEach(add);
  all.filter(e=>e.weekly&&fresh(e)).forEach(addFresh);
  all.filter(e=>!e.weekly&&due(e)).forEach(add);
  all.filter(e=>!e.weekly&&fresh(e)).forEach(addFresh);
  if(out.length<n) shuffle(all.filter(e=>!out.includes(e))).forEach(add);   // le reste : révision au hasard
  return shuffle(out);
}
function wordsMastered(){ return wordEntries().filter(e=>(S.box[e.id]||[0])[0]>=4).length }

/* ---------- Carnet et pièges ---------- */
function carnetEntries(){
  return (CONTENT.carnet||[]).map(x=>{
    if(!x||typeof x!=="object") return null;
    if(x.t==="word"){ const w=cleanWord(x); return w?entry(w,"word","W",{carnet:true}):null }
    if(typeof x.s==="string"&&(x.s.match(/___/g)||[]).length===1&&Array.isArray(x.o)&&x.o.length>=2&&x.o.length<=5&&x.o.every(o=>typeof o==="string")&&Number.isInteger(x.a)&&x.a>=0&&x.a<x.o.length){
      const c=["A","I","H","C","V"].includes(x.c)?x.c:"A";
      return entry({s:x.s,o:x.o,a:x.a,w:typeof x.w==="string"?x.w:"",src:c},"choice",c,{carnet:true});
    }
    return null;
  }).filter(Boolean);
}
function entryIndex(){
  const key=PROFILE.id+"|"+PROFILE.level+"|"+CONTENT.ver;
  if(IDX&&IDX.key===key) return IDX.map;
  const map={}, add=e=>{ if(!map[e.id]) map[e.id]=e };
  carnetEntries().forEach(add);
  asChoice(levelChoices(PROFILE.level)).forEach(add);
  chassePool(PROFILE.level).forEach(c=>add(entry(c,"chasse",c[2])));
  wordEntries().forEach(add);
  IDX={key,map}; return map;
}
function trapEntries(){
  const today=dayNum(), map=entryIndex(), out=[];
  Object.entries(S.box||{}).forEach(([id,v])=>{ const e=map[id]; if(e&&v[0]<MASTER&&v[1]<=today) out.push([e,v[1],v[0],Math.random()]) });
  carnetEntries().forEach(e=>{ if(!S.box[e.id]) out.push([e,0,0,Math.random()]) });   // nouvelles questions du carnet : tout de suite
  out.sort((x,y)=>x[1]-y[1]||x[2]-y[2]||x[3]-y[3]);
  return out.map(x=>x[0]);
}
function trapStats(){
  const map=entryIndex(), today=dayNum(); let open=0,due=0,done=0;
  Object.entries(S.box||{}).forEach(([id,v])=>{ if(!map[id]) return; if(v[0]>=MASTER) done++; else { open++; if(v[1]<=today) due++ } });
  carnetEntries().forEach(e=>{ if(!S.box[e.id]){ open++; due++ } });
  return {open,due,done};
}
function trapsBeaten(){ const words=new Set(wordEntries().map(e=>e.id)); return Object.entries(S.box||{}).filter(([id,v])=>v[0]>=4&&!words.has(id)).length }

/* ---------- Composition des manches ---------- */
function chasseRound(){
  const L=PROFILE.level, pool=chassePool(L).map(c=>entry(c,"chasse",c[2]));
  const k=nGen(), gens=[];
  for(let i=0;i<k;i++){ const g=genChasse(); gens.push(entry(g.it,"chasse",g.cat,{gen:true})) }
  const items=mixIn(draw("chasse_"+L,pool,6-k),gens);
  const rel=relectureEntry(); if(rel) items.push(rel);
  return items;
}
function relectureEntry(){
  const L=PROFILE.level;
  if(isPrim(L)) return draw("relecture_"+L,PRIM[L].relecture.map(r=>entry(r,"relecture","R")),1)[0];
  // collège : 3 phrases fautives + 1 juste, tirées de la chasse du niveau
  const all=chassePool(L), hasErr=c=>/\{/.test(c[0]);
  const parts=shuffle(shuffle(all.filter(hasErr)).slice(0,3).concat(shuffle(all.filter(c=>!hasErr(c))).slice(0,1)));
  const bad=parts.filter(hasErr);
  return entry({t:"text",x:parts.map(c=>c[0]).join(" "),w:bad.map(c=>c[1]),c:bad.map(c=>c[2])},"relecture","R",{gen:true});
}
function dicteeRound(){ const L=PROFILE.level, D=isPrim(L)?PRIM[L].dictees:DICTEES; return pickWords(4).concat(draw("dictee_"+(isPrim(L)?L:"cm2"),D.map(t=>entry(t,"dictee","D")),1)) }
function defiRound(){
  const traps=trapEntries().slice(0,6);
  if(traps.length>=6) return traps;
  const cat=weakestCat(), ids=new Set(traps.map(e=>e.id));
  const pool=asChoice(levelChoices(PROFILE.level).filter(q=>q.src===cat)).filter(e=>!ids.has(e.id));
  return traps.concat(draw("defi_"+PROFILE.level+"_"+cat,pool,6-traps.length));
}
function buildRound(mode){
  const L=PROFILE.level, all=levelChoices(L), of=c=>asChoice(all.filter(q=>q.src===c));
  switch(mode){
    case "chasse": return chasseRound();
    case "mordre": { const k=nGen(); return mixIn(draw("mordre_"+L,of("I"),8-k),genEntries("I",k)) }
    case "jumeaux": return draw("jumeaux_"+L,of("H"),8);
    case "accords": case "catA": { const k=nGen(); return mixIn(draw(L+"_A",of("A"),8-k),genEntries("A",k)) }
    case "catH": return draw(L+"_H",of("H"),8);
    case "catC": return draw(L+"_C",of("C"),8);
    case "motjuste": return draw(L+"_V",of("V"),8);
    case "dictee": return dicteeRound();
    case "mots": return pickWords(6);
    case "defi": return defiRound();
  }
  return [];
}
function start(mode){
  sfx("click");
  if(mode==="blaster") return startBlaster();
  if(mode==="hangar") return openHangar();
  if(mode==="duel") return openDuel();
  const items=buildRound(mode);
  if(!items.length){ toast("Rien à jouer ici pour l'instant","Reviens plus tard !"); return }
  R={mode,items,i:0,res:[],xp:0,combo:0,bonus:mode==="defi"&&!defiDoneToday()};
  saveLocal(); question();
}
function head(){
  const m=MISSIONS[R.mode], n=R.items.length;
  const dots=n>1?R.items.map((e,k)=>`<i class="${k<R.res.length?(R.res[k]?"ok":"ko"):(k===R.i?"now":"")}${e.kind==="relecture"?" big":""}"></i>`).join(""):"";
  return `<div class="top"><button class="ghost" id="quit">← Missions</button><span class="pill">${m.name}${n>1?` · ${R.i+1}/${n}`:""}</span><div class="dots" aria-hidden="true">${dots}</div></div>`;
}
function question(){
  if(R.i>=R.items.length) return endRound();
  const e=R.items[R.i];
  ({choice:qChoice,chasse:qChasse,dictee:qDictee,word:qWord,relecture:qRelecture})[e.kind](e);
  $("#quit").onclick=home;
}
/* opt.log=false : déjà noté ailleurs · opt.leitner=false : pas de boîte (relecture) */
function score(ok,gain,opt){
  opt=opt||{}; const e=R.items[R.i];
  R.res.push(ok);
  if(opt.log!==false) logAnswer(e.cat,ok);
  if(!e.gen&&opt.leitner!==false) leitner(e.id,ok,e.kind==="word"||!!e.carnet);
  sfx(ok?"good":"bad");
  if(ok){R.combo++; S.cnt.combo=Math.max(S.cnt.combo,R.combo); let g=(gain||10)+(R.combo>=3?5:0); if(R.bonus) g*=2; R.xp+=g; checkTrophies(); return g}
  R.combo=0; checkTrophies(); return 0;
}
function feedback(ok,gain,html){
  const v = ok ? (gain>10&&R.combo>=3?`Bien vu ! +${gain} (série de ${R.combo})`:`Bien vu ! +${gain}`) : "Raté, mais voilà le truc :";
  return `<div class="feedback ${ok?"ok":"ko"}" role="status"><b class="v">${v}</b>${html}</div>
    <button class="primary" id="next">${R.i+1<R.items.length?"Suivant":"Voir mon score"}</button>`;
}
function bindNext(){const n=$("#next");n.onclick=()=>{R.i++;question()};n.focus()}

function parse(s){
  s=s.replace(/\{[^}]*\}/g,m=>m.replace(/ /g,"\u0001")).replace(/ ([!?:;»])/g,"\u0001$1").replace(/« /g,"«\u0001");
  return s.split(" ").map(t=>t.replace(/\u0001/g," ")).map(tok=>{
    const m=tok.match(/^(.*)\{([^|}]+)\|([^}]+)\}(.*)$/);
    return m?{show:m[1]+m[2]+m[4],fixed:m[1]+m[3]+m[4],err:true}:{show:tok,fixed:tok,err:false};
  });
}
function qChasse(e){
  const [s,why]=e.it, toks=parse(s), hasErr=toks.some(t=>t.err);
  screen.innerHTML=`<div class="card">${head()}

const words=s=>s.replace(/[’]/g,"'").match(/[\p{L}\p{N}'-]+/gu)||[];
function diff(a,b){
  const n=a.length,m=b.length,D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=0;i<=n;i++)D[i][m]=n-i; for(let j=0;j<=m;j++)D[n][j]=m-j;
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    D[i][j]=Math.min(D[i+1][j+1]+(a[i]===b[j]?0:1),D[i+1][j]+1,D[i][j+1]+1);
  const out=[];let i=0,j=0;
  while(i<n||j<m){
    if(i<n&&j<m&&D[i][j]===D[i+1][j+1]+(a[i]===b[j]?0:1)){out.push(a[i]===b[j]?{t:"eq",w:b[j]}:{t:"sub",his:a[i],w:b[j]});i++;j++}
    else if(j<m&&D[i][j]===D[i][j+1]+1){out.push({t:"ins",w:b[j]});j++}
    else {out.push({t:"del",w:a[i]});i++}
  }
  return out;
}

function catOfPair(x,y){
  x=x.replace(/[.,!?;: ]+$/,""); y=y.replace(/[.,!?;: ]+$/,"");
  if(HOMO.has(x)&&HOMO.has(y)) return "H";
  const er=/er$/, pp=/(é|ée|és|ées)$/;
  return ((er.test(x)&&pp.test(y))||(pp.test(x)&&er.test(y)))?"I":"A";
}
function qRelecture(e){
  const it=e.it, toks=parse(it.x), errs=toks.map((t,k)=>t.err?k:-1).filter(k=>k>=0), total=errs.length;
  const info={}; errs.forEach((k,j)=>{ info[k]={w:(it.w||[])[j]||"",c:(it.c||[])[j]||catOfPair(toks[k].show,toks[k].fixed)} });
  let found=0, fa=0, over=false;
  screen.innerHTML=`<div class="card">${head()}
    <p class="prompt"><b>Grande relecture.</b> ${e.gen?"Ces phrases cachent":esc(rnd(SLEEPERS))+" a écrit ce texte en dormant. Il cache"} <b>${total} fautes</b>. Fais tes 4 passes, puis touche chaque mot faux.</p>

    <span class="relcount" id="relc" role="status">Trouvées : 0 / ${total}</span>

    <ul class="rlist" id="rlist"></ul>
    <button class="zero" id="giveup">Je ne trouve plus</button>
    <div id="fb"></div></div>`;
  const list=$("#rlist"), cnt=$("#relc");
  const note=(cls,html)=>{ const li=document.createElement("li"); li.className=cls; li.innerHTML=html; list.appendChild(li) };
  const finish=()=>{
    over=true; screen.querySelectorAll(".w").forEach(b=>b.disabled=true); $("#giveup").disabled=true;
    const perfect=found===total&&fa<=1; if(perfect) S.cnt.relec=(S.cnt.relec||0)+1;
    const gain=score(perfect,10*found+(perfect?15:0),{log:false,leitner:false});
    const msg=perfect?`Les ${total} fautes trouvées${fa?", avec une seule fausse alerte":""} : relecture de champion !`
      :found===total?`Toutes trouvées, mais ${fa} fausses alertes : relis plus lentement avant de toucher.`
      :`${found} sur ${total}. Les fautes ratées sont en orange : laquelle de tes 4 passes les aurait attrapées ?`;
    $("#fb").innerHTML=feedback(perfect,gain,`<p class="why">${msg}</p>`); bindNext();
  };
  screen.querySelectorAll(".w").forEach(b=>b.onclick=()=>{
    if(over) return; const k=+b.dataset.k, t=toks[k];

      logAnswer(info[k].c,true); note("ok",`<b>${esc(t.fixed)}</b> : ${esc(info[k].w)}`); if(found===total) finish() }
    else { if(b.classList.contains("picked-ko")) return; b.classList.add("picked-ko"); fa++; sfx("bad"); note("fa",`« ${esc(t.show)} » était juste.`) }
  });

    finish() };

function blasterPool(){
  const all=levelChoices(PROFILE.level);
  const base=all.filter(q=>q.src!=="V").concat(shuffle(all.filter(q=>q.src==="V")).slice(0,6));   // un peu de « mot juste », pas trop
  const recent=S.recent.blaster||[];
  const fresh=shuffle(base.filter(q=>!recent.includes(q.id)));
  const old=shuffle(base.filter(q=>recent.includes(q.id)));
  return fresh.concat(old);
}

function pickQ(){
  const cat=G.boss?G.boss.cat:null;
  if(Math.random()<0.25){   // une question sur quatre est générée
    const gc=isPrim(PROFILE.level)?((cat==="I"||cat==="A")?cat:(!cat||cat==="*")?rnd(["I","A"]):null):((!cat||cat==="*"||cat==="A")?"A":null);
    const g=gc&&genChoice(gc); if(g) return g;
  }
  for(let tries=0;tries<2;tries++){
    for(let k=G.qi;k<G.queue.length;k++){
      const q=G.queue[k];
      if(!cat||cat==="*"||q.src===cat){ G.queue.splice(k,1); return q }
    }
    G.queue=blasterPool(); G.qi=0;
  }
  return G.queue.shift();
}
function wordTop(){ return G.boss ? G.boss.y+44 : G.hudH-20 }
function nextQ(){
  G.q=pickQ(); if(!G.q.gen) G.used.push(G.q.id);
  G.state="play"; G.banner=null; G.bullets=[]; if(G.firing) G.needRelease=true;
  ["rapid","slow","x2"].forEach(k=>{ if(G.fx[k]>0) G.fx[k]-- });
  const n=G.q.o.length, order=shuffle([...Array(n).keys()]);
  let speed=(G.H/10.5)*(1+0.15*(G.level-1));
  if(G.fx.slow>0) speed*=0.6;
  let f=19, ws;
  const measure=()=>{G.ctx.font="600 "+f+"px Lexend, sans-serif"; ws=order.map(k=>Math.max(64,G.ctx.measureText(G.q.o[k]).width+2*f*0.8))};
  measure(); while(ws.reduce((s,v)=>s+v,0)>G.W-8*(n+1) && f>12){f--;measure()}
  const gap=(G.W-ws.reduce((s,v)=>s+v,0))/(n+1);
  let cx=gap; const top=wordTop();
  G.words=order.map((k,slot)=>{
    const w=ws[slot], x=cx+w/2; cx+=w+gap;
    return {text:G.q.o[k],ok:k===G.q.a,x,y:top-Math.random()*30,w,h:40,f,vy:speed*(0.9+Math.random()*0.2),alive:true};
  });
}

function resolve(ok,why){
  G.lvlStats.total++; if(ok) G.lvlStats.good++;
  const slow=!ok&&why==="Le bon mot est passé !";
  G.total++; logAnswer(G.q.src, ok, slow); sfx(ok?"good":"bad");
  if(!G.q.gen) leitner(G.q.id, ok);
  if(!ok&&!G.missed.some(m=>m.q===G.q)) G.missed.push({q:G.q,slow});
  if(ok){
    G.good++; G.combo++; S.cnt.combo=Math.max(S.cnt.combo,G.combo);
    let pts=100*(1+Math.floor(G.combo/3))+10*G.level; if(G.fx.x2>0) pts*=2; G.score+=pts;
    let title=`+${pts}${G.combo>=3?`  ·  combo x${1+Math.floor(G.combo/3)}`:""}`;
    const hitWord=G.words.find(w=>w.ok);
    if(G.boss){
      const dmg=[0,25,32,40][G.power];
      G.boss.hp=Math.max(0,G.boss.hp-dmg); G.boss.hit=0.3;
      G.beams.push({x1:G.ship.x,y1:G.H-60,x2:G.boss.x,y2:G.boss.y,t:0.45,p:G.power});
      title+=`  ·  boss -${dmg}`;
      if(G.boss.hp<=0){
        const bonus=500*G.level; G.score+=bonus;
        boom(G.boss.x,G.boss.y,SPACE.gold,70,1.6); boom(G.boss.x,G.boss.y,SPACE.pink,50,1.2);
        G.shake=reduceMotion?0:10;
        title=`${G.boss.name} est vaincu !  +${bonus}`;
        dropBonus(G.boss.x,G.boss.y,G.power<3?"power":"x2");
        G.rings.push({x:G.boss.x,y:G.boss.y,r:10,max:Math.max(G.W,G.H),c:SPACE.gold,w:6});
        S.cnt.boss++; if(!G.bossHits) S.cnt.bossP++; sfx("bigboom"); SFX.boss=false;
        G.boss=null; G.bossesBeaten++; G.bombs=[];
        G.levelDone=true;
      }
    } else {
      G.lvlGood++;
      if(hitWord && Math.random()<0.35) dropBonus(hitWord.x,hitWord.y);
      if(G.lvlGood>=6) spawnBoss();
    }

    if(hitWord){ G.rings.push({x:hitWord.x,y:hitWord.y,r:6,max:50+G.power*25,c:["",SPACE.gold,SPACE.cyan,SPACE.pink][G.power],w:3+G.power}) }
    checkTrophies();
    G.banner={ok:true,title,text:G.q.w};
    G.timer=(G.levelDone?3.6:2.8)+readExtra(G.q.w);
  } else {
    G.combo=0; loseShield(); G.shake=reduceMotion?0:14;
    G.banner={ok:false,title:why+" La bonne réponse : « "+G.q.o[G.q.a]+" ».",text:G.q.w};
    G.timer=4.4+readExtra(G.q.w);
  }
  G.state="banner";
  G.words.forEach(w=>{ if(w.alive){ boom(w.x,w.y, w.ok?SPACE.good:SPACE.dim, w.ok&&ok?26:10); w.alive=false } });
}

    ctx.shadowColor=b.color; ctx.shadowBlur=16; ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(d.x,d.y,r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle=SPACE.bg; ctx.font="12px Bungee, 'Arial Black', sans-serif"; ctx.fillText(b.short,d.x,d.y+1)});
  // bombes
  G.bombs.forEach(b=>{ctx.shadowColor=SPACE.bad; ctx.shadowBlur=14; ctx.fillStyle=SPACE.bad; ctx.beginPath(); ctx.arc(b.x,b.y,9,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle="#ffd2d6"; ctx.beginPath(); ctx.arc(b.x-3,b.y-3,3,0,Math.PI*2); ctx.fill()});
  // tirs
  ctx.lineCap="round";
  G.bullets.forEach(b=>{
    const col=equipColor("shot",G.t+b.y/300)||["",SPACE.gold,SPACE.cyan,SPACE.pink][b.p], len=[0,26,36,b.core?64:30][b.p], wid=[0,4,5,b.core?8:4][b.p];
    const g=ctx.createLinearGradient(b.x,b.y+len,b.x,b.y); g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(0.6,col); g.addColorStop(1,"#ffffff");
    ctx.shadowColor=col; ctx.shadowBlur=b.p===1?10:18; ctx.strokeStyle=g; ctx.lineWidth=wid;
    ctx.beginPath(); ctx.moveTo(b.x,b.y+len); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.fillStyle="#ffffff"; ctx.beginPath(); ctx.arc(b.x,b.y,wid*0.6+(b.core?3:0),0,Math.PI*2); ctx.fill();
    if(b.core){ ctx.strokeStyle="rgba(95,211,255,.8)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(b.x,b.y,9+Math.sin(G.t*30)*2,0,Math.PI*2); ctx.stroke() }
    ctx.shadowBlur=0;
  });
  G.beams.forEach(b=>{ const a=b.t/0.45, col=["",SPACE.gold,SPACE.cyan,SPACE.pink][b.p||1];
    ctx.globalAlpha=a; ctx.shadowColor=col; ctx.shadowBlur=30;
    ctx.strokeStyle=col; ctx.lineWidth=10+b.p*6; ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=3+b.p*2; ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.shadowBlur=0; ctx.globalAlpha=1 });
  G.rings.forEach(r=>{ ctx.globalAlpha=Math.max(0,1-r.r/r.max); ctx.strokeStyle=r.c; ctx.lineWidth=r.w; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke() }); ctx.globalAlpha=1;
  ctx.lineCap="butt";
  G.parts.forEach(p=>{ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.c; ctx.fillRect(p.x-2,p.y-2,4,4)}); ctx.globalAlpha=1;
  // vaisseau (clignote après un coup)
  if(!(G.hurtT>0 && Math.floor(G.hurtT*10)%2===0)){
    drawShip(ctx,G.ship.x,H-56,G.skin,G.t,G.power,1);
    { const dcl=shopItem((S.equip||{}).decal); if(dcl) drawDecal(ctx,G.ship.x,H-54,dcl.shape,1) }
    if(G.muzzle>0){ const col=equipColor("shot",G.t)||["",SPACE.gold,SPACE.cyan,SPACE.pink][G.power]; ctx.shadowColor=col; ctx.shadowBlur=20; ctx.fillStyle="#ffffff"; ctx.globalAlpha=G.muzzle/0.07; ctx.beginPath(); ctx.arc(G.ship.x,H-84,6+G.power*2,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; ctx.shadowBlur=0 }
  }
  if(G.running) drawShield(ctx,G.ship.x,H-54);
  // bannière d'explication
  if(G.banner){
    ctx.font="600 17px Lexend, sans-serif"; ctx.textAlign="left"; ctx.textBaseline="top";
    const bw=Math.min(W-24,520), tl=wrap(ctx,G.banner.title,bw-28), bl=wrap(ctx,G.banner.text,bw-28);
    const bh=24+tl.length*24+bl.length*23+8, bx=(W-bw)/2, by=G.hudH+(G.boss?80:16);
    ctx.fillStyle=G.banner.ok?"rgba(16,70,44,.95)":"rgba(92,22,32,.95)"; rr(ctx,bx,by,bw,bh,14); ctx.fill();
    ctx.strokeStyle=G.banner.ok?SPACE.good:SPACE.bad; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=G.banner.ok?SPACE.good:"#ffd2d6"; ctx.font="700 17px Lexend, sans-serif";
    tl.forEach((l,i)=>ctx.fillText(l,bx+14,by+12+i*24));
    ctx.fillStyle=SPACE.ink; ctx.font="16px Lexend, sans-serif";
    bl.forEach((l,i)=>ctx.fillText(l,bx+14,by+16+tl.length*24+i*23));
  }
  if(G.flash){
    ctx.globalAlpha=Math.min(1,G.flash.t); ctx.textAlign="center"; ctx.textBaseline="middle";
    let fs=30; ctx.font=fs+"px Bungee, 'Arial Black', sans-serif";
    const txt=G.flash.text.toUpperCase(); while(ctx.measureText(txt).width>W-30&&fs>14){fs--; ctx.font=fs+"px Bungee, 'Arial Black', sans-serif"}
    ctx.fillStyle=G.flash.color||SPACE.gold; ctx.fillText(txt,W/2,H*0.6);
    if(G.boss && G.flash.text.startsWith("BOSS")){ ctx.font="15px Lexend, sans-serif"; ctx.fillStyle=SPACE.ink; wrap(ctx,"« "+G.boss.taunt+" »",W-50).forEach((l,i)=>ctx.fillText(l,W/2,H*0.6+34+i*20)) }
    ctx.globalAlpha=1;
  }
  if(G.brief) drawBrief(ctx,W,H);
  if(G.warp) drawWarp(ctx,W,H);
  if(G.megaFx>0){ctx.globalAlpha=G.megaFx; ctx.fillStyle="#ff9f3c"; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1}
  if(G.paused){ctx.fillStyle="rgba(7,10,26,.7)";ctx.fillRect(0,0,W,H);ctx.font="34px Bungee, 'Arial Black', sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=SPACE.ink;ctx.fillText("PAUSE",W/2,H/2)}
  ctx.restore();
}
function drawWarp(ctx,W,H){
  const Wp=G.warp, t=Wp.t; ctx.textAlign="center"; ctx.textBaseline="middle";
  const fit=(txt,fs,maxW)=>{ const f=n=>n+"px Bungee, 'Arial Black', sans-serif"; ctx.font=f(fs); while(ctx.measureText(txt).width>maxW&&fs>12){fs--;ctx.font=f(fs)} };
  if(Wp.first){
    const a=Math.min(1,t/0.4)*Math.min(1,(Wp.dur-t)/0.5);
    ctx.globalAlpha=Math.max(0,a); fit("ZONE "+G.level,44,W-30); ctx.fillStyle=SPACE.gold; ctx.fillText("ZONE "+G.level,W/2,H*0.42);
    ctx.font="18px Lexend, sans-serif"; ctx.fillStyle=SPACE.ink; ctx.fillText(Wp.zone.name,W/2,H*0.42+40);
    ctx.globalAlpha=1; return;
  }
  if(t<2.0){ // bilan de la zone
    const a=Math.min(1,t/0.3)*Math.min(1,(2.0-t)/0.3);
    ctx.globalAlpha=Math.max(0,a)*0.55; ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H); ctx.globalAlpha=Math.max(0,a);
    const head="ZONE "+(G.level-1)+" TERMINÉE !"; fit(head,34,W-30); ctx.fillStyle=SPACE.gold; ctx.fillText(head,W/2,H*0.38);
    ctx.font="18px Lexend, sans-serif"; ctx.fillStyle=SPACE.ink;
    ctx.fillText(Wp.stats.good+" bonne"+(Wp.stats.good>1?"s":"")+" réponse"+(Wp.stats.good>1?"s":"")+" sur "+Wp.stats.total,W/2,H*0.38+44);
    ctx.fillText("Boss vaincu · score "+G.score,W/2,H*0.38+72);
    ctx.globalAlpha=1;
  } else { // saut vers la zone suivante
    const k=t-2.0, a=Math.min(1,k/0.4)*Math.min(1,(Wp.dur-t)/0.5), s=1+Math.max(0,0.6-k)*1.2;
    ctx.globalAlpha=Math.max(0,a);
    ctx.save(); ctx.translate(W/2,H*0.36); ctx.scale(s,s);
    fit("ZONE "+G.level,48,W-30); ctx.fillStyle=SPACE.gold; ctx.fillText("ZONE "+G.level,0,0); ctx.restore();
    ctx.font="18px Lexend, sans-serif"; ctx.fillStyle=SPACE.ink; ctx.fillText(Wp.zone.name,W/2,H*0.36+44);
    let y=H*0.36+82;
    if(Wp.gotLife){ ctx.fillStyle="#ffffff"; ctx.font="16px Bungee, 'Arial Black', sans-serif"; ctx.fillText("+1 VIE",W/2,y); y+=30 }
    if(Wp.newSkin){ const tx="NOUVEAU VAISSEAU : "+Wp.newSkin.toUpperCase(); fit(tx,18,W-30); ctx.fillStyle=SPACE.pink; ctx.fillText(tx,W/2,y) }
    ctx.globalAlpha=1;
  }
}
/* ---------- Carburant, briefing des boss, récap des pièges ---------- */
function paintFuel(){
  const el=$("#fuelline"), go=$("#go"); if(!el||!go) return;
  if(isGuest()){ el.innerHTML=""; go.disabled=false; return }
  el.innerHTML=`Carburant ${fuelCells()} ${S.fuel>0?`${S.fuel} partie${S.fuel>1?"s":""}`:"vide"}`;
  go.disabled=S.fuel<1;
  if(S.fuel<1){ el.innerHTML+=`<br><small>Une mission réussie recharge le réservoir : au moins la moitié juste, +1 partie ; presque tout juste, +2.</small><br><button class="ghost" id="refuel" type="button">Aller aux missions</button>`; $("#refuel").onclick=home }
}
/* Réussite récente sur une catégorie (14 derniers jours), ou null si trop peu de réponses */
function catRate(cat){
  const since=new Date(); since.setDate(since.getDate()-14); const lim=dayKey(since); let g=0,t=0;
  Object.entries(S.log||{}).forEach(([k,d])=>{ if(k<lim) return; Object.entries(d).forEach(([c,v])=>{ if(cat==="*"||c===cat){ g+=v[0]; t+=v[1] } }) });
  return t>=5?Math.round(g/t*100):null;
}
function bossRule(B){
  const cm2=isPrim(PROFILE.level);
  switch(B.cat){
    case "I": return "Remplace par « mordre » ou « mordu ». « Mordre » marche : -er. « Mordu » marche : -é. Et après être, demande-toi « qui ? » pour accorder : -ée, -és, -ées.";
    case "H": return cm2?"Remplace pour vérifier. a / à : « avait ». et / est : « était ». on / ont : « il » ou « avaient ». son / sont : « mon » ou « étaient ».":"Remplace pour vérifier : c'est / s'est (cela est ?), leur / leurs (plusieurs ?), quand / quant (lorsque ?), près / prêt (préparé ?).";
    case "A": if(B.kind===3) return "Chaque, c'est un seul : chaque joueur, chaque matin. Par jour = chaque jour. Et mille ne prend jamais de s.";
      return cm2?"Trouve d'abord qui commande l'accord, puis choisis. Le mot collé au verbe n'est pas toujours le chef ! Vingt et cent prennent un s seulement s'ils sont multipliés et en fin de nombre."
        :"Avec être : accord avec le sujet. Avec avoir : accord avec le COD seulement s'il est placé avant. Vingt et cent : un s s'ils sont multipliés et en fin de nombre.";
    case "C": return "Cherche ce qui commande le mode : après « si », jamais de conditionnel ; « bien que » et « pour que » veulent le subjonctif ; « après que », l'indicatif.";
    default: return "Tout mélangé ! Pour chaque phrase, fais tes 4 passes en accéléré : le verbe, le groupe du nom, é ou er, les jumeaux.";
  }
}
function startBrief(){
  G.state="brief"; G.words=[]; G.banner=null; G.flash=null;
  G.brief={t:0,held:G.firing,tap:false,rule:bossRule(G.boss),rate:catRate(G.boss.cat)};
}
function drawBrief(ctx,W,H){
  const B=G.boss, b=G.brief; if(!B||!b) return;
  const bw=Math.min(W-24,540), pad=18, x0=(W-bw)/2, inner=bw-2*pad;
  ctx.save(); ctx.globalAlpha=Math.min(1,b.t/0.35); ctx.textAlign="left"; ctx.textBaseline="top";
  ctx.font="italic 15px Lexend, sans-serif"; const tl=wrap(ctx,"« "+B.taunt+" »",inner);
  ctx.font="16px Lexend, sans-serif"; const rl=wrap(ctx,b.rule,inner);
  ctx.font="14px Lexend, sans-serif"; const sl=b.rate==null?[]:wrap(ctx,`Toi, sur ce type de règle : ${b.rate} % de réussite ces 14 derniers jours.`,inner);
  const bh=pad+28+tl.length*20+12+18+rl.length*22+(sl.length?8+sl.length*19:0)+48+pad;
  const y0=Math.max(G.hudH+96,Math.min(H*0.3,H-bh-24));
  ctx.fillStyle="rgba(10,14,40,.95)"; rr(ctx,x0,y0,bw,bh,16); ctx.fill();
  ctx.shadowColor=SPACE.pink; ctx.shadowBlur=18; ctx.strokeStyle=SPACE.pink; ctx.lineWidth=2; ctx.stroke(); ctx.shadowBlur=0;
  let y=y0+pad, fs=20; const ttl="BOSS : "+B.name.toUpperCase();
  ctx.font=fs+"px Bungee, 'Arial Black', sans-serif"; while(ctx.measureText(ttl).width>inner&&fs>12){fs--; ctx.font=fs+"px Bungee, 'Arial Black', sans-serif"}
  ctx.fillStyle=SPACE.pink; ctx.fillText(ttl,x0+pad,y); y+=28;
  ctx.font="italic 15px Lexend, sans-serif"; ctx.fillStyle=SPACE.dim; tl.forEach(l=>{ctx.fillText(l,x0+pad,y); y+=20}); y+=12;
  ctx.font="12px Bungee, 'Arial Black', sans-serif"; ctx.fillStyle=SPACE.gold; ctx.fillText("SA RÈGLE, POUR LE BATTRE",x0+pad,y); y+=18;
  ctx.font="16px Lexend, sans-serif"; ctx.fillStyle=SPACE.ink; rl.forEach(l=>{ctx.fillText(l,x0+pad,y); y+=22});
  if(sl.length){ y+=8; ctx.font="14px Lexend, sans-serif"; ctx.fillStyle=b.rate>=80?SPACE.good:SPACE.gold; sl.forEach(l=>{ctx.fillText(l,x0+pad,y); y+=19}) }
  y+=12; ctx.textAlign="center"; ctx.font="13px Bungee, 'Arial Black', sans-serif";
  ctx.fillStyle=b.t>1.5?(Math.floor(b.t*2.5)%2?SPACE.gold:SPACE.ink):SPACE.dim;
  ctx.fillText(b.t>1.5?"TIRE POUR COMMENCER":"LIS LA RÈGLE…",W/2,y);
  ctx.fillStyle="rgba(255,255,255,.12)"; rr(ctx,x0+pad,y+24,inner,5,3); ctx.fill();
  ctx.fillStyle=SPACE.pink; rr(ctx,x0+pad,y+24,Math.max(6,inner*Math.min(1,b.t/8)),5,3); ctx.fill();
  ctx.restore();
}
function recapHtml(){
  const list=G.missed; if(!list.length) return "";
  return `<div class="recap"><b>Les pièges qui t'ont eu</b><ul>${list.slice(0,5).map(m=>{ const p=m.q.s.split("___");
    return `<li>${esc(p[0])}<b>${esc(m.q.o[m.q.a])}</b>${esc(p[1]||"")} <em>${m.slow?"trop lent":"mauvaise cible"}</em></li>` }).join("")}</ul>${list.length>5?`<small>Et ${list.length-5} autre${list.length>6?"s":""}. </small>`:""}${!isGuest()&&list.some(m=>!m.q.gen)?`<small>Ils reviendront dans ton Défi du jour.</small>`:""}</div>`;
}
function gameOver(){
  G.running=false; musicStop();
  const dg=G.good-G.paid.good, dt=G.total-G.paid.total, db=G.bossesBeaten-G.paid.bosses;
  G.paid={good:G.good,total:G.total,bosses:G.bossesBeaten};
  const xp=dg*5+20*db, record=G.score>S.best;
  if(record) S.best=G.score;
  S.recent.blaster=(S.recent.blaster||[]).concat(G.used).slice(-70);
  let st=0;
  if(dt){ st=touchStreak()+earn(Math.floor(dg/3)+5*db); S.xp+=xp; checkTrophies(); S.hist.blaster.push(Math.round(dg/dt*100)); S.hist.blaster=S.hist.blaster.slice(-20) }
  save(); renderBoard();
  const ov=$("#ov"); ov.hidden=false;
  ov.innerHTML=`<h2>${record&&!isGuest()?"Nouveau record !":"Fin de mission"}</h2>
    <div class="big">${G.score}</div>
    <p>${G.good} bonne${G.good>1?"s":""} réponse${G.good>1?"s":""} sur ${G.total} · zone ${G.level} · ${G.bossesBeaten} boss vaincu${G.bossesBeaten>1?"s":""} · record ${S.best}</p>
    ${isGuest()?"":`<p class="earn">+${xp} points${st?` · +${st} ★`:""}</p>`}
    ${recapHtml()}
    ${isGuest()?"":`<p class="fuelline">Carburant ${fuelCells()} ${S.fuel>0?`encore ${S.fuel} partie${S.fuel>1?"s":""}`:"vide : une mission réussie le recharge"}</p>`}
    <div class="row" style="justify-content:center">${!isGuest()&&S.fuel<1?`<button class="primary" id="back" style="align-self:center">Missions : recharger</button>`:`<button class="primary" id="again" style="align-self:center">Rejouer</button><button class="ghost" id="back">Missions</button>`}</div>`;
  const ag=$("#again"); if(ag) ag.onclick=startBlaster; $("#back").onclick=home;
}
function renderSkins(){
  const box=$("#skins"); if(!box) return;
  box.innerHTML=SKINS.map((s,i)=>`<button class="skin${i===S.skin?" on":""}" data-i="${i}" ${i>S.skinMax?"disabled":""} aria-label="${s.name}${i>S.skinMax?" (verrouillé)":""}"><canvas width="112" height="112"></canvas><span>${i>S.skinMax?"Niveau "+s.lvl:s.name}</span></button>`).join("");
  box.querySelectorAll(".skin").forEach(b=>{
    const i=+b.dataset.i, c=b.querySelector("canvas"), x=c.getContext("2d");
    x.scale(2,2); if(i>S.skinMax){ x.globalAlpha=.25 } drawShip(x,28,30,i,0,1,0.8);
    if(i<=S.skinMax) b.onclick=()=>{ S.skin=i; if(G) G.skin=i; saveLocal(); renderSkins() };
  });
}

if("speechSynthesis" in window){try{speechSynthesis.getVoices()}catch(e){}}
(function boot(){
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}) }catch(e){}
  const imp=importWordsFromHash(), who=loadWho();
  if(who.name){ PROFILES.eleve.name=who.name; selectProfile("eleve",savedLevel()) } else welcome();
  if(imp) setTimeout(()=>announceImport(imp),400);
})();
</script>
